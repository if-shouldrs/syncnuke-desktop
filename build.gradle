plugins {
    id 'java'
}

group = 'io.github.syncnuke'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // SyncNuke Core
    implementation "io.github.syncnuke:syncnuke-core:0.2.0"

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    // SLF4J
    implementation 'org.slf4j:slf4j-api:2.0.17'

    // Tinylog
    implementation 'org.tinylog:tinylog-impl:2.7.0'
    implementation 'org.tinylog:slf4j-tinylog:2.7.0'

    // junixsocket (pom packaging is not relevant in Gradle)
    implementation 'com.kohlschutter.junixsocket:junixsocket-core:2.10.1'

    // Command Line Parser
    implementation 'commons-cli:commons-cli:1.9.0'

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.1'
    testImplementation 'org.mockito:mockito-core:5.18.0'
}

test {
    useJUnitPlatform()
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds an executable JAR containing syncnuke-core and all runtime dependencies.'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Main-Class': 'io.github.syncnuke.Main',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }

    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }

    // Signatures from dependency JARs are invalid after their contents are merged.
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

tasks.named('assemble') {
    dependsOn tasks.named('fatJar')
}
